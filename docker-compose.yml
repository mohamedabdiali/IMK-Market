services:
  app:
    build: .
    env_file:
      - .env
    ports:
      - "5050:5050"
    restart: unless-stopped
    volumes:
      - ./:/usr/src/app:ro
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: imkmarket
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d imkmarket"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data: