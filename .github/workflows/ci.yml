name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/imk?schema=public
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: imk
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Apply Prisma migrations
        run: npx prisma migrate deploy
      - name: Seed database
        run: npm run server:seed
      - name: Lint
        run: npm run lint
      - name: Typecheck (strict)
        run: npm run typecheck:strict || true
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test -- --reporter=dot
